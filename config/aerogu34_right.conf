# Zephyr 4 xiao_ble defaults bind the UART console to a second USB CDC ACM
# endpoint, which collides with the studio-rpc-usb-uart endpoint that DYA
# Studio expects to open. Disable the board-default serial backend so only
# the Studio RPC CDC ACM is exposed.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# 【保険 2026-07-26】USB CDC-ACMの内部リングバッファ拡大（既定1024・jisaku_1と統一）。
# forkのStudio RPCトランスポート(uart_rpc_transport.c serial_cb)は、ホストがポートを
# 読まなくなるとCDCバッファ満杯→TX無限ループでUSB全体(HID含む)が凍結する問題がある
# （cormoranへ報告予定）。応答全体が余裕で収まるサイズにして満杯自体を回避する。
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192

# PAW3222 trackball
CONFIG_PAW3222=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# ZMK Studio
CONFIG_ZMK_STUDIO=y
# 注意: STUDIO_LOCKING は既定値(y)のままにすること。
# LOCKING有効時のみ ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK が働き、
# &studio_unlock 押下時にBLE広告を再開して Web Bluetooth (DYA Studio/公式Studio) から
# キーボードを検出できるようになる。
# CONFIG_ZMK_STUDIO_LOCKING=n にするとホスト接続中は広告が止まり、
# StudioがBLEでキーボードを発見できなくなる（過去に発生済み）。

# 【2026-07-26 復帰】接続凍結の真犯人はDYA Studioクライアント側ライブラリ
# (react-zmk-studioのタイムアウト改修)と確定し、dya-studio fork側でSHA固定により修正済み。
# BLE経由でのStudio検出を復活させるため、unlock時のBLE広告再開を再度有効化する。
# 既知の注意点: fork実装は接続中にオープン広告を開始する暂定コードのため、
# &studio_unlock 押下時に既存BT接続が一瞬乱れる可能性あり。
# 許容できない場合は =n に戻すこと（その間BLEでのStudio検出は不可、USB経由は可）。
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y

# ロック解除の手間を軽減 (電源投入後に一度 &studio_unlock を押せばOK):
# - Studio切断時の自動再ロックを無効化
# - アイドル再ロックを10分→1時間に延長
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=3600

# 【2026-07-26】Studio接続中のBLE低遅延化（BLEキーマップ読込中の切断ループ対策その1）。
# 通常時は BT_PERIPHERAL_PREF_LATENCY=10 で省電力化しているが、ZMKのStudio用低遅延切替は
# 「TRANSPORT_BLE_PREF_LATENCY < BT_PERIPHERAL_PREF_LATENCY」の場合のみコンパイルされる
# （両方とも既定/設定値10のため 10<10=偽 となり切替コードごと無効化されていた）。
# 0にするとStudioのIndication購読中だけ latency 0 を要求し、27バイト×ACK往復で行われる
# キーマップ転送が大幅に高速化する。Studio切断時は自動で latency 10 に復帰するため
# 通常使用時の電池持ちへの影響はない。
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0

# ========================================
# BLE
# ========================================
# 【2026-07-27】同時接続数を 6 → 4 に削減（LL_ASSERT対策・jisaku_1と統一）。
# コントローラは接続ごとに無線イベント枠を確保するため、上限が大きいほど
# スケジュールが詰まりやすい。実際に必要なのは「ホスト1 + 左ハーフ1 + 遷移中の余裕」で、
# ペアリング済みプロファイル数は BT_MAX_PAIRED 側で決まるので登録済みプロファイルは失われない。
# ※ ホストに繋がらない等の症状が出たら 6 に戻すこと。
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_DIS=y
# 送信出力 +8dBm は維持する。無線イベントのスケジューリング余裕とは無関係で、
# 下げるとスプリット間リンクの再送が増えて逆効果になるため。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# 【2026-07-27】希望接続間隔の下限を 7.5ms(6) → 15ms(12) に緩和。
# ウォッチドッグに idle スレッドの Kernel Oops (BLEコントローラのLL_ASSERT) が
# 記録されており、上流でもnRF52の多重リンク+短間隔時に
# LL_ASSERT_OVERHEAD（無線イベントを予定時刻に詰め込めない）が報告されている。
# ホスト接続・スプリット接続・Studioの通知・Prospector広告が同一の無線スケジュールを
# 共有するため、1イベントあたりの余裕を作る。体感遅延はStudio接続中の latency 0 で担保される。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10

# ========================================
# Battery
# ========================================
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# 【2026-07-26 復活】標準バッテリーサービス(BAS)を有効化 (jisaku_1と統一)。
# BAS無効化はホスト/DYA Studioでの残量0%表示の原因だった。さらにセントラルが
# 左半分の残量を取得する仕組み(BATTERY_LEVEL_FETCHING)自体が相手側BASの購読のため、
# 無効化すると左の残量取得も壊れる。=n には戻さないこと。
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# RGB LED widget
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# ========================================
# DYA Studio モジュール (Central側)
# ========================================
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048

# DYA Studio 安定化
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# デバイス情報
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# ウォッチドッグ (右側MCU専用。freeze検出含むフル機能。
# デバッグ中の一時無効化は2026-07-26に解除済み)
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# 【2026-07-26】フリーズ誤検知対策（BLEキーマップ読込中の切断ループ対策その2）。
# Studio BLE転送中はRPC送信ミューテックスを長時間保持するため、その間に発生した
# Studio通知の送信処理がワークキュー上でブロックする。既定10秒のままだと正常な
# 大型転送(キーマップ読込)をフリーズと誤検知して再起動→切断→再接続ループになる。
CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS=60000
# 低優先度キュー監視を停止。上記の誤検知経路を除去しつつ、モジュール作者が
# DESIGN.mdで注意喚起しているスプリットセントラルの無線タイミング起因再起動
# (LL_ASSERT_OVERHEAD)への緩和策として周期feedタイマーを半減する。
CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n

# 【2026-07-27】BLEコントローラのアサート内容を記録する（jisaku_1と統一）。
# これを入れないと LL_ASSERT 失敗が素の k_oops になり、記録は
# 「PC 0x00051746 / LR 0x00051737 / スレッド idle」のようにELFなしでは解読不能な値だけになる。
# 有効化すると bt_ctlr_assert_handle() が呼ばれ、
# 「スレッド名」欄にアサート元ファイル名、「PC」欄に行番号が入るため、
# どのアサートが発火したのか（開発用アサートか本当のスケジュール溢れか）を特定できる。
# ※ このオプションが CONFIG_BT_CTLR_ASSERT_HANDLER を自動で有効化する。
#   他のモジュールで bt_ctlr_assert_handle() を定義しないこと（多重定義になる）。
CONFIG_ZMK_CTLR_ASSERT_INFO=y

# キースイッチ診断
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
# Split: 左側の診断データを中継してDYA Studioへ表示
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
# 中継ペイロードは1トポロジーヘージ分必要 (左側と共通)
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# Runtime input processor (トラックボール設定)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ========================================
# 入力ストリーム / カスタム設定 / OS検出 / デフォルトレイヤー (DYA Studio 2026-07-26追加)
# ========================================
# 入力ストリーム: DYA StudioのInsights(打鍵ヒートマップ)とKeymapタブのStreamトグル用。
# これが無いと実機接続時に「入力ストリームサブシステムが利用できません」となる（デモのみ表示）。
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# カスタム設定 + Studio RPC: 設定タブの「詳細設定」表示に必須（aerogu34はモジュール自体が未追加だった）
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

# OS検出: USB/BLE接続先のOSを推定してStudioへ通知（接続タブの「OS追従」用）
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# デフォルトレイヤー切替: 接続先/OSごとの基本レイヤー切替（接続タブ）。
# 候補レイヤーは0〜4（aerogu34は5レイヤー構成）。レイヤーを増やしたらMAX_INDEXも更新すること。
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=4

# ========================================
# 打鍵統計 (キーボード側保存のヒートマップ 2026-07-27追加・jisaku_1と統一)
# ========================================
# Studioを開いていない間の打鍵も数え、電源を切っても保持する。
# - (レイヤー, キー位置) 別カウンタ … 物理ヒートマップとレイヤー使用率用
# - HIDキーコード別カウンタ … 「Aを何回打ったか」。キーマップ変更やコンボ/マクロ経由の出力にも強い
# スプリットの左(peripheral)側は設定不要。打鍵はセントラル(右)に中継されるためここで数えられる。
CONFIG_ZMK_KEY_USAGE=y
CONFIG_ZMK_KEY_USAGE_STUDIO_RPC=y
CONFIG_ZMK_KEY_USAGE_TRACK_KEYCODES=y
# aerogu34は5レイヤー構成 + 予備1
CONFIG_ZMK_KEY_USAGE_MAX_LAYERS=6
# 両ハーフ合計34キー + 予備 (RAM: MAX_LAYERS × MAX_POSITIONS × 2バイト)
CONFIG_ZMK_KEY_USAGE_MAX_POSITIONS=40
# フラッシュ書き込みは最短5分間隔 + アイドル/スリープ時 + Studioからの明示保存のみ
CONFIG_ZMK_KEY_USAGE_SAVE_DEBOUNCE_MINUTES=5

# nanopbエンコードを行う低優先度ワーカースレッドのスタック
# (jisaku_1で確認したスタックオーバーフロー対策と統一 2026-07-26)
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
# システムワークキューのスタック増量 (jisaku_1のsysworkqフリーズ/スタック不足対策と統一)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ========================================
# 【2026-07-26 追加】上記スタック増量を適用したファームでも
# BLEキーマップ読込中の切断(GATT Server is disconnected)が再現するため、
# 残る候補を潰し、次回のクラッシュで原因が一意に特定できるようにする（jisaku_1と統一）。
# ========================================
# スレッド名を保持し、スタックを越えた瞬間にMPUで例外を発生させる。
# これがないと隣のメモリを黙って壊してから崩壊するため、
# ウォッチドッグの記録がPC/LRのごみ値だけになり原因スレッドが分からない。
CONFIG_THREAD_NAME=y
CONFIG_HW_STACK_PROTECTION=y
# 未増量だったスタック。init処理とBLE受信スレッドは
# 設定読込とGATTコールバック経由でStudio RPCの処理を抱えるため余裕を持たせる。
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
# StudioはIndicationを連続送信するため、既定の少ないTXバッファでは
# セントラル側(左ハーフ接続)と競合して送信失敗→リンク断になりうる。
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_CONN_TX_MAX=10
# 監視タイムアウトを4秒に延長し、大型転送中に数インターバル
# 取りこぼしても即切断にならないようにする。
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# jisaku_1と統一: フラッシュ書き込み頻度を下げる
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# ========================================
# Prospector
# ========================================
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Aerogu34"
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=10000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=2000
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30

# ========================================
# 省電力
# ========================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_PM_SOFT_OFF=y

# ========================================
# キースキャン
# ========================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
