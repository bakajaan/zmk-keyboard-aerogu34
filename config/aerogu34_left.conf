# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y

# RGB LED widget
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# ========================================
# DYA Studio modules (Peripheral side)
# ========================================
# Battery history (data collection on peripheral)
CONFIG_ZMK_BATTERY_HISTORY=y

# Settings RPC (receive settings changes from central)
CONFIG_ZMK_SETTINGS_RPC=y

# Split event relay (peripheral -> central)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# Setting persistence
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# ========================================
# 低遅延・安定化(jisaku_1と同設定)
# ========================================
# キースキャン低遅延化(eager debounce: 押下1ms＋解放5ms、検出遅延を約4ms短縮)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# スリープ復帰後などにホスト側の購読状態が食い違って入力が届かなくなる問題のワークアラウンド
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ソフトオフ(ScrollレイヤーのU+I+Oコンボで電源断、jisaku_1と同設定)
CONFIG_ZMK_PM_SOFT_OFF=y
